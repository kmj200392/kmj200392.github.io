<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#ffffff">
    {% if site.author.avatar %}
    <link rel="icon" type="image/png" href="{{ site.author.avatar | relative_url }}">
    <link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/assets/images/favicon.svg' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ site.author.avatar | relative_url }}">
    <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ site.author.avatar | absolute_url }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main-v2.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    {% include header.html %}
    <div class="site-shell{% if page.url == '/' %} site-shell--home{% endif %}">
      {% if page.author_profile %}
        {% include sidebar.html %}
      {% endif %}
      <main class="page-content" id="main-content" tabindex="-1">
        {{ content }}
      </main>
    </div>
  </body>
</html>
