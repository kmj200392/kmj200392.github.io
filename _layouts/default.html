<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="theme-color" content="#ffffff">
    {% if site.author.avatar %}
    <link rel="icon" href="{{ site.author.avatar }}">
    <link rel="apple-touch-icon" href="{{ site.author.avatar }}">
    <meta property="og:image" content="{{ site.author.avatar }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="{{ site.author.avatar }}">
    {% endif %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      {% if page.author_profile %}
        {% include sidebar.html %}
      {% endif %}
      <main class="page-content">
        {{ content }}
      </main>
    </div>
  </body>
</html>
