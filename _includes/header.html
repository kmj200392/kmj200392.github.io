<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}"><span class="site-monogram" aria-hidden="true">m.</span>{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.url == '/projects/' and page.url contains '/projects/' %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
